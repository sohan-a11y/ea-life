services:
  life:
    build: {context: ., dockerfile: Dockerfile.life}
    user: "10001:10001"
    command: ["python", "-u", "runner.py"]
    network_mode: "none"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.25
    restart: "no"
    environment:
      SIM_GRID: "96"
      SIM_POPULATION: "12"
      SIM_MAX_POPULATION: "40"
      SIM_MAX_ORGANISMS: "500"
      SIM_SCENARIO: "mixed"
      SIM_TICKS: "100000"
      TICK_SLEEP: "0.04"
      SAVE_EVERY: "10"
      SIM_SEED: "20261015"
      STATE_DIR: /state
      REQUEST_DIR: /exchange/requests
      RESULT_DIR: /exchange/results
      CONTROL_DIR: /control
      RESUME: "0"
    volumes:
      - life_state:/state
      - request_queue:/exchange/requests
      - result_inbox:/exchange/results:ro
      - control_queue:/control
  dashboard:
    build: {context: ., dockerfile: Dockerfile.dashboard}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m,uid=10001,gid=10001"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      STATE_DIR: /state
      CONTROL_DIR: /control
      DASHBOARD_PORT: "8000"
    volumes:
      - life_state:/state:ro
      - control_queue:/control
    networks: [dashboard_net]
  broker:
    build: {context: ., dockerfile: Dockerfile.broker}
    user: "10001:10001"
    command: ["python", "-u", "broker.py"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m,uid=10001,gid=10001"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    restart: "no"
    environment:
      REQUEST_DIR: /exchange/requests
      RESULT_DIR: /exchange/results
      BROKER_MAX_REQUESTS: "200"
      BROKER_MIN_INTERVAL: "1.5"
      BROKER_POLL_SECONDS: "0.5"
    volumes:
      - request_queue:/exchange/requests:ro
      - result_inbox:/exchange/results
    # No listener or published port. Destination enforcement is application-level.
volumes:
  life_state:
  request_queue:
  result_inbox:
  control_queue:
networks:
  dashboard_net:
    internal: true
