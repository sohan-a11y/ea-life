name: EA-Life CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q ea_life runner.py broker.py dashboard.py experiments.py analyze.py
      - name: Check dashboard JavaScript
        run: node --check web/app.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Smoke test offline benchmark CLI
        run: python experiments.py --scenario mixed --seeds 1 --ticks 10 --grid-size 32 --population 4 --max-population 4 --max-organisms 4 --output /tmp/ea-life-smoke.csv && test -s /tmp/ea-life-smoke.csv
      - name: Smoke test four-condition research ablation
        run: python experiments.py --ablation-suite --seeds 1 --ticks 8 --grid-size 32 --population 4 --max-population 4 --max-organisms 4 --output /tmp/ea-life-ablation.csv && test "$(wc -l < /tmp/ea-life-ablation.csv)" -eq 5
      - name: Smoke test neural latent imagination ablation
        run: python experiments.py --latent-ablation-suite --seeds 1 --ticks 8 --grid-size 32 --population 4 --max-population 4 --max-organisms 4 --output /tmp/ea-life-latent.csv && test "$(wc -l < /tmp/ea-life-latent.csv)" -eq 5
      - name: Smoke test paired analysis
        run: python analyze.py /tmp/ea-life-latent.csv | grep -q 'Reference condition'
      - name: Validate Compose
        run: docker compose -f compose.yaml -f compose.ci.yaml config -q
      - name: Container integration smoke test
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml up --build -d
          trap 'docker compose -f compose.yaml -f compose.ci.yaml down -v' EXIT
          docker compose -f compose.yaml -f compose.ci.yaml config | grep -q 'host_ip: 127.0.0.1'
          for attempt in $(seq 1 30); do
            # Test the path a browser uses: host -> runtime-published port -> dashboard.
            port="$(docker compose -f compose.yaml -f compose.ci.yaml port dashboard 8000 2>/dev/null || true)"
            if [ -n "$port" ] && curl -fsS --max-time 2 "http://$port/api/state" -o /tmp/ea-life-state.json \
               && python -c 'import json; s=json.load(open("/tmp/ea-life-state.json")); assert s["ok"]; assert s["grid_size"] == 32; assert len(s["resource_trails"]) == 32; assert len(s["danger_trails"]) == 32'; then
              printf 'Dashboard reachable from the host at %s\n' "$port"
              case "$port" in
                127.0.0.1:*) ;;
                *) echo "Dashboard must be published on loopback only"; exit 1 ;;
              esac
              if docker compose -f compose.yaml -f compose.ci.yaml exec -T dashboard python -c 'import socket; socket.create_connection(("1.1.1.1", 443), timeout=5)'; then
                echo "Dashboard container must not have a route to the internet"; exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          docker compose -f compose.yaml -f compose.ci.yaml ps -a
          docker compose -f compose.yaml -f compose.ci.yaml logs --no-color
          exit 1
