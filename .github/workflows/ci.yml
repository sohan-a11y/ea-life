name: EA-Life CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q life.py broker.py dashboard.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Compose
        run: docker compose config -q
