name: EA-Life CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q ea_life runner.py broker.py dashboard.py experiments.py experiments.py
      - name: Check dashboard JavaScript
        run: node --check web/app.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test offline benchmark CLI
        run: python experiments.py --scenario mixed --seeds 1 --ticks 10 --grid-size 32 --population 4 --max-population 4 --max-organisms 4 --output /tmp/ea-life-smoke.csv && test -s /tmp/ea-life-smoke.csv
      - name: Smoke test four-condition research ablation
        run: python experiments.py --ablation-suite --seeds 1 --ticks 8 --grid-size 32 --population 4 --max-population 4 --max-organisms 4 --output /tmp/ea-life-ablation.csv && test "$(wc -l < /tmp/ea-life-ablation.csv)" -eq 5
      - name: Smoke test neural latent imagination ablation
        run: python experiments.py --latent-ablation-suite --seeds 1 --ticks 8 --grid-size 32 --population 4 --max-population 4 --max-organisms 4 --output /tmp/ea-life-latent.csv && test "$(wc -l < /tmp/ea-life-latent.csv)" -eq 5
      - name: Validate Compose
        run: docker compose -f compose.yaml -f compose.ci.yaml config -q
      - name: Container integration smoke test
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml up --build -d
          trap 'docker compose -f compose.yaml -f compose.ci.yaml down -v' EXIT
          docker compose -f compose.yaml -f compose.ci.yaml config | grep -q 'host_ip: 127.0.0.1'
          bindings="$(docker inspect "$(docker compose -f compose.yaml -f compose.ci.yaml ps -q dashboard)" --format '{{json .HostConfig.PortBindings}}')"
          printf 'Dashboard runtime port bindings: %s\n' "$bindings"
          printf '%s' "$bindings" | grep -q '127.0.0.1'
          for attempt in $(seq 1 30); do
            if docker compose -f compose.yaml -f compose.ci.yaml exec -T dashboard python -c 'import json,urllib.request; s=json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/state",timeout=2)); assert s["ok"]; assert s["grid_size"] == 32; assert len(s["resource_trails"]) == 32; assert len(s["danger_trails"]) == 32'; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f compose.yaml -f compose.ci.yaml ps -a
          docker compose -f compose.yaml -f compose.ci.yaml logs --no-color
          exit 1
